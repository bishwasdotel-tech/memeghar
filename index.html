<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nepal Unfiltered Meme Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@700&family=Bebas+Neue&family=Archivo+Black&family=Montserrat:wght@900&family=Comic+Neue:wght@700&family=Noto+Sans+Devanagari:wght@800&family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f1;--panel:#fff;--ink:#16130f;--mute:#6b645b;--line:#e3ded7;--red:#dc1032;--cyan:#0fb4e3;--amber:#fbb91c;--stage:#e9e5df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--panel:#1d1a16;--ink:#f3efe9;--mute:#a49c91;--line:#332e28;--stage:#0e0c0a}}
:root[data-theme="dark"]{--bg:#14120f;--panel:#1d1a16;--ink:#f3efe9;--mute:#a49c91;--line:#332e28;--stage:#0e0c0a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 "Bricolage Grotesque",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:3px solid var(--red)}
header img{height:44px;width:auto}
header h1{font-size:20px;margin:0;font-weight:800}
header span{color:var(--mute);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;padding:20px;max-width:1240px;margin:0 auto}
.stage{background:var(--stage);border-radius:14px;display:flex;align-items:flex-start;justify-content:center;padding:16px;min-height:360px;position:sticky;top:8px;align-self:start}
canvas{max-width:100%;max-height:84vh;width:auto;height:auto;border-radius:6px;box-shadow:0 2px 18px rgba(0,0,0,.25)}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px}
h2{font-size:13px;margin:0 0 6px;color:var(--mute);font-weight:700}
h3{font-size:12px;margin:8px 0 4px;color:var(--mute);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:block;padding:6px 11px;border:1.5px solid var(--line);border-radius:999px;font-weight:700;font-size:13px}
.chip input:checked+span{background:var(--red);border-color:var(--red);color:#fff}
.chip input:focus-visible+span{outline:2px solid var(--cyan);outline-offset:2px}
input[type=text],textarea,select{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:6px}
textarea{resize:vertical;min-height:64px}
input[type=range]{width:100%;accent-color:var(--red)}
label.l{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
.pri{background:var(--red);color:#fff;width:100%}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.pos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:108px}
.pos label{position:relative;height:26px}
.pos input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.pos span{display:block;height:100%;border:1.5px solid var(--line);border-radius:6px}
.pos input:checked+span{background:var(--amber);border-color:var(--amber)}
.pos input:focus-visible+span{outline:2px solid var(--cyan)}
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.th div{position:relative;width:54px;height:54px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:2px solid var(--line);cursor:pointer}
.th b{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;line-height:20px;text-align:center;cursor:pointer}
.note{font-size:12px;color:var(--mute);margin:0}
header{border-bottom:5px solid;border-image:linear-gradient(90deg,#dc1032,#003893,#0fb4e3,#fbb91c) 1;background:linear-gradient(100deg,var(--panel),var(--bg))}
body{background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
aside{box-shadow:0 8px 30px rgba(0,0,0,.08);gap:12px}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
summary{font-weight:800;cursor:pointer;margin-bottom:8px;font-size:15px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tc{position:relative}.tc input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.tc span{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;font-weight:700;font-size:13px;background:var(--panel)}
.tc i{font-style:normal;font-size:18px}
.tc input:checked+span{background:var(--red);color:#fff;border-color:var(--red)}
.tc input:focus-visible+span{outline:2px solid var(--cyan);outline-offset:2px}
.lp{display:flex;gap:10px;align-items:center;margin-bottom:8px}.lp img{width:56px;height:56px;object-fit:contain;border:1.5px solid var(--line);border-radius:10px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/14px 14px}
.lp div{display:flex;flex-direction:column;gap:6px;flex:1}.lp button{padding:7px 10px;font-size:13px}
.ghost{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
@media(max-width:860px){main{grid-template-columns:1fr;padding:12px}.stage{position:static}}
</style></head><body>

</aside></main>
<script>
const W=1080,cv=document.getElementById('c'),x=cv.getContext('2d'),$=id=>document.getElementById(id);
const logo=new Image(),DEF=$('hl').src;logo.src=DEF;let LG=logo,CU=false;
const S={imgs:[],tpl:'classic',pos:'br'};let t1='',t2='',LN=[];
const FONTS={impact:['Impact, Anton, sans-serif',400,'Impact (classic)'],anton:['Anton',400,'Anton'],oswald:['Oswald',700,'Oswald'],bebas:['"Bebas Neue"',400,'Bebas Neue'],archivo:['"Archivo Black"',400,'Archivo Black'],mont:['Montserrat',900,'Montserrat Black'],comic:['"Comic Neue","Comic Sans MS"',700,'Comic Sans style'],nep:['"Noto Sans Devanagari"',800,'Nepali (Devanagari)']};
Object.entries(FONTS).forEach(([k,v])=>$('fo').insertAdjacentHTML('beforeend',`<option value="${k}">Font: ${v[2]}</option>`));
const PAL={c:{bg:'#ffffff',ink:'#000000',acc:'#dc1032',acc2:'#fbb91c'},n:{bg:'#fff4ee',ink:'#0b2a6f',acc:'#dc143c',acc2:'#fbb91c'},d:{bg:'#111111',ink:'#ffffff',acc:'#0fb4e3',acc2:'#fbb91c'},s:{bg:'#ffe8d1',ink:'#3a1030',acc:'#ff5a36',acc2:'#7a2a8c'},m:{bg:'#e6fbf1',ink:'#06352b',acc:'#10b981',acc2:'#f59e0b'}};const P=()=>PAL[$('ds').value];
const STY={w:['#fff','#000'],y:['#ffe600','#000'],r:['#fff','#dc1032'],k:['#000',null]};
const FIL={n:'none',bw:'grayscale(1) contrast(1.1)',df:'contrast(2) saturate(2.4) brightness(1.05)',se:'sepia(.9)'};
const sys=s=>`700 ${s}px "Bricolage Grotesque","Noto Sans Devanagari",sans-serif`;
const fnt=(s,k)=>{const f=FONTS[k||$('fo').value];return `${f[1]} ${s}px ${f[0]}, "Noto Sans Devanagari", sans-serif`};

function wrap(t,f,mw){x.font=f;const L=[];let c='';t.split(/\s+/).filter(Boolean).forEach(q=>{const n=c?c+' '+q:q;if(x.measureText(n).width>mw&&c){L.push(c);c=q}else c=n});if(c)L.push(c);return L}
function fit(t,mw,ml,st,mn,o={}){t=o.nc?t:cap(t);st*=K();mn*=K();const F=s=>o.sys?sys(s):fnt(s,o.fk);for(let s=st;s>=mn;s-=4){const f=F(s),L=wrap(t,f,mw);if(L.length<=ml)return{L,s,f}}const f=F(mn);return{L:wrap(t,f,mw),s:mn,f}}
function draw(t,cx,y,mw,ml,st,mn,o={}){if(!t||!t.trim())return 0;const q=fit(t,mw,ml,st,mn,o),[fill,stk]=o.fill?[o.fill,o.stroke]:STY[$('sy').value];
x.font=q.f;x.textAlign=o.align||'center';x.textBaseline='top';x.lineJoin='round';const lh=q.s*1.12,h=lh*q.L.length;let yy=o.bottom?y-h:o.mid?y-h/2:y;
q.L.forEach(l=>{if(stk){x.lineWidth=q.s/7;x.strokeStyle=stk;x.strokeText(l,cx,yy)}x.fillStyle=fill;x.fillText(l,cx,yy);yy+=lh});return h}
function size(h){cv.width=W;cv.height=h;x.fillStyle=P().bg;x.fillRect(0,0,W,h)}
function cover(im,dx,dy,dw,dh){const r=Math.max(dw/im.width,dh/im.height),w=im.width*r,h=im.height*r;x.save();x.beginPath();x.rect(dx,dy,dw,dh);x.clip();x.filter=FIL[$('fl').value];x.drawImage(im,dx+(dw-w)/2,dy+(dh-h)/2,w,h);x.restore()}
function ph(i,dx,dy,dw,dh){const im=S.imgs[i];if(im)return cover(im,dx,dy,dw,dh);x.fillStyle='#d9d3cb';x.fillRect(dx,dy,dw,dh);x.fillStyle='#7a7268';x.font='700 40px "Bricolage Grotesque",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('+ photo '+(i+1),dx+dw/2,dy+dh/2)}
function PH(){const r=$('ra').value,im=S.imgs[0];if(r=='s')return 1080;if(r=='p')return 1350;if(r=='w')return 608;return im?Math.min(1500,Math.max(700,Math.round(W*im.height/im.width))):1080}
function titleBar(h){if(!t1.trim())return 0;const q=fit(t1,W-100,3,80,36),b=Math.round(q.L.length*q.s*1.2+56);return b}
const T={
classic:{e:'🔠',n:'Top & bottom',g:1,r(){const h=PH();size(h);ph(0,0,0,W,h);draw(t1,W/2,28,W-80,3,120,56);draw(t2,W/2,h-28,W-80,3,120,56,{bottom:1});return[0,0]}},
bar:{e:'⬆️',n:'Caption above',g:1,r(){const h=PH(),b=titleBar();size(h+b);if(b)draw(t1,W/2,28,W-100,3,80,36,{fill:P().ink});ph(0,0,b,W,h);draw(t2,W/2,b+h-28,W-80,3,100,48,{bottom:1});return[b,0]}},
news:{e:'📺',n:'Breaking news',g:1,r(){const h=PH(),bh=190,y=h-bh;size(h);ph(0,0,0,W,h);x.fillStyle=P().acc;x.fillRect(0,y,W,bh);x.fillStyle='#000';x.fillRect(0,y,W,8);x.fillStyle='#fbb91c';x.fillRect(0,y-46,330,46);draw(lab(0,'BREAKING NEWS'),22,y-23,300,1,30,16,{align:'left',mid:1,fill:'#000'});draw(t1||'Your headline here',35,y+24,W-70,2,56,32,{align:'left',fill:'#fff'});draw(t2,35,y+bh-14,W-70,1,28,18,{bottom:1,align:'left',fill:'#fff'});return[0,bh+46]}},
poster:{e:'🍿',n:'Movie poster',g:1,r(){const h=PH();size(h);ph(0,0,0,W,h);const g=x.createLinearGradient(0,h*.4,0,h);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.88)');x.fillStyle=g;x.fillRect(0,h*.4,W,h*.6);const s=draw(t2,50,h-44,W-100,1,44,24,{bottom:1,align:'left',fill:'#fbb91c'});draw(t1,50,h-44-s-(s?14:0),W-100,3,110,48,{bottom:1,align:'left',fill:'#fff'});return[0,0]}},
plain:{e:'🖼️',n:'Photo only',g:1,r(){const h=PH();size(h);ph(0,0,0,W,h);return[0,0]}},
post:{e:'💬',n:'Social post',g:1,r(){const P_=P(),im=S.imgs[0],pw=W-80,pa=im?Math.min(1100,Math.max(520,Math.round(pw*im.height/im.width))):760,o={sys:1,nc:1},q=t1.trim()?fit(t1,pw,6,46,30,o):{L:[],s:0},th=q.L.length*q.s*1.3,H=Math.round(174+th+(th?24:0)+pa+110);size(H);clogo(40,40,100);draw(lab(0,'Nepal Unfiltered'),166,52,W-220,1,40,26,{align:'left',fill:P_.ink,sys:1,nc:1});draw(lab(1,'Just now'),166,100,W-220,1,28,20,{align:'left',fill:'#8a8378',sys:1,nc:1});if(th)draw(t1,40,174,pw,6,46,30,{align:'left',fill:P_.ink,sys:1,nc:1});const py=174+th+(th?24:0);x.save();x.beginPath();x.roundRect(40,py,pw,pa,22);x.clip();ph(0,40,py,pw,pa);x.restore();draw('👍❤️😂  1.2K        218 comments  ·  94 shares',40,py+pa+36,pw,1,30,20,{align:'left',fill:'#8a8378',sys:1,nc:1});return[0,0]}},
quote:{e:'❝',n:'Quote card',g:1,r(){const h=PH();size(h);ph(0,0,0,W,h);x.fillStyle='rgba(0,0,0,.58)';x.fillRect(0,0,W,h);draw('“',W/2,70,300,1,300,120,{fill:P().acc2});const a=draw(t1,W/2,h/2+30,W-180,6,92,38,{mid:1,fill:'#fff'});draw(t2?'— '+t2:'',W/2,h/2+30+a/2+36,W-180,1,44,24,{fill:P().acc2});return[0,0]}},
polaroid:{e:'📸',n:'Polaroid',g:1,r(){const fw=W-220,s=fw-60,fh=s+260,H=fh+220;size(H);x.fillStyle=P().acc2;x.globalAlpha=.25;x.fillRect(0,0,W,H);x.globalAlpha=1;x.save();x.translate(W/2,H/2);x.rotate(-.035);x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=36;x.shadowOffsetY=12;x.fillStyle='#fff';x.fillRect(-fw/2,-fh/2,fw,fh);x.shadowColor='transparent';ph(0,-s/2,-fh/2+30,s,s);draw(t1,0,-fh/2+30+s+100,fw-80,2,84,40,{mid:1,fill:'#222',fk:'comic',nc:1});x.restore();return[0,0]}},
subtitle:{e:'🎬',n:'Movie subtitle',g:1,r(){const h=PH(),bar=110;size(h+2*bar);x.fillStyle='#000';x.fillRect(0,0,W,h+2*bar);ph(0,0,bar,W,h);const o={fill:'#ffe600',stroke:'#000',bottom:1,sys:1,nc:1},a=draw(t1,W/2,bar+h-34,W-140,2,60,32,o);draw(t2,W/2,bar+h-34-a-6,W-140,2,60,32,{...o,fill:'#fff'});return[bar,bar]}},
trio:{e:'👥',n:'Three way',g:2,r(){const b=titleBar(),h=860,g=8,cw=(W-2*g)/3;size(b+h);if(b)draw(t1,W/2,28,W-100,3,80,36,{fill:P().ink});for(let i=0;i<3;i++){const px=i*(cw+g);ph(i,px,b,cw,h);draw(lab(i),px+cw/2,b+h-24,cw-30,4,70,28,{bottom:1})}return[b,0]}},
comic:{e:'🗯️',n:'Comic strip',g:2,r(){const g=16,pw=(W-3*g)/2;size(W);x.fillStyle='#111';x.fillRect(0,0,W,W);for(let i=0;i<4;i++){const px=g+(i%2)*(pw+g),py=g+Math.floor(i/2)*(pw+g);ph(i,px,py,pw,pw);const t=lab(i);if(t){const q=fit(t,pw-70,3,44,22,{fk:'comic'});x.font=q.f;const wd=Math.max(...q.L.map(l=>x.measureText(l).width)),hh=q.L.length*q.s*1.12+22;x.fillStyle='#ffe600';x.fillRect(px+14,py+14,wd+30,hh);x.strokeStyle='#000';x.lineWidth=4;x.strokeRect(px+14,py+14,wd+30,hh);draw(t,px+29,py+25,pw-70,3,44,22,{align:'left',fill:'#000',fk:'comic'})}}return[0,0]}},
film:{e:'🎞️',n:'Film strip',g:2,r(){const n=Math.min(4,Math.max(2,S.imgs.length)),fh=560,g=14,H=n*(fh+g)+g;size(H);x.fillStyle='#111';x.fillRect(0,0,W,H);x.fillStyle='#f3efe9';for(let y=14;y<H-30;y+=64){x.beginPath();x.roundRect(28,y,34,40,7);x.roundRect(W-62,y,34,40,7);x.fill()}for(let i=0;i<n;i++){const y=g+i*(fh+g);ph(i,100,y,W-200,fh);draw(lab(i),W/2,y+fh-22,W-260,2,70,30,{bottom:1})}return[0,0]}},
drake:{e:'🙅',n:'Yes / No (Drake)',g:2,r(){size(1080);ph(0,0,0,540,540);ph(1,0,540,540,540);x.fillStyle=P().bg;x.fillRect(540,0,540,1080);x.fillStyle='#dc1032';x.fillRect(540,0,12,540);x.fillStyle='#1faa59';x.fillRect(540,540,12,540);x.fillStyle='#ddd';x.fillRect(540,538,540,4);draw(lab(0,t1),816,270,470,4,80,34,{mid:1,fill:P().ink});draw(lab(1,t2),816,810,470,4,80,34,{mid:1,fill:P().ink});return[0,0]}},
vs:{e:'⚔️',n:'Side by side',g:2,r(){const b=titleBar(),h=760;size(b+h);if(b)draw(t1,W/2,28,W-100,3,80,36,{fill:P().ink});ph(0,0,b,W/2-4,h);ph(1,W/2+4,b,W/2-4,h);draw(lab(0),W/4,b+h-24,W/2-40,3,80,34,{bottom:1});draw(lab(1),W*.75,b+h-24,W/2-40,3,80,34,{bottom:1});x.fillStyle='#fbb91c';x.strokeStyle='#000';x.lineWidth=6;x.beginPath();x.arc(W/2,b+h/2,62,0,7);x.fill();x.stroke();draw('VS',W/2,b+h/2,120,1,64,30,{mid:1,fill:'#000'});return[b,0]}},
stack:{e:'⏳',n:'Before / after',g:2,r(){const b=titleBar(),h=620;size(b+2*h+8);if(b)draw(t1,W/2,28,W-100,3,80,36,{fill:P().ink});ph(0,0,b,W,h);ph(1,0,b+h+8,W,h);draw(lab(0),W/2,b+h-24,W-80,2,90,36,{bottom:1});draw(lab(1),W/2,b+2*h-16,W-80,2,90,36,{bottom:1});return[b,0]}},
brain:{e:'🧠',n:'Expanding brain',g:2,r(){const n=Math.min(4,Math.max(2,S.imgs.length)),rh=300,C=['#e9e6e1','#fff0a0','#8fe3ff','#ff9fd8'];size(n*rh);for(let i=0;i<n;i++){x.fillStyle=C[i];x.fillRect(400,i*rh,680,rh);ph(i,0,i*rh,400,rh);draw(lab(i),740,i*rh+rh/2,600,3,70,30,{mid:1,fill:'#000'})}return[0,0]}},
grid:{e:'🔲',n:'Starter pack grid',g:2,r(){const n=S.imgs.length,c=n<=4?4:n<=6?6:9,cols=c==4?2:3,rows=c/cols,g=8,cw=(W-(cols+1)*g)/cols,b=titleBar();size(b+rows*(cw+g)+g);if(b)draw(t1,W/2,28,W-100,3,80,36,{fill:P().ink});for(let i=0;i<c;i++){const px=g+(i%cols)*(cw+g),py=b+g+Math.floor(i/cols)*(cw+g);ph(i,px,py,cw,cw);if(lab(i)){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(px,py+cw-100,cw,100);draw(lab(i),px+cw/2,py+cw-50,cw-24,2,44,20,{mid:1,fill:'#fff'})}}return[b,0]}}
};
Object.entries(T).forEach(([k,v],i)=>$('t'+v.g+'g').insertAdjacentHTML('beforeend',`<label class="tc"><input type="radio" name="t" value="${k}" ${k=='classic'?'checked':''}><span><i>${v.e}</i>${v.n}</span></label>`));
['tl','tc','tr','ml','mc','mr','bl','bc','br'].forEach(p=>$('pos').insertAdjacentHTML('beforeend',`<label><input type="radio" name="p" value="${p}" ${p=='br'?'checked':''} aria-label="Watermark position ${p}"><span></span></label>`));
const LW=()=>LG.naturalWidth||LG.width,LH=()=>LG.naturalHeight||LG.height;
function clogo(px,py,d){const r=Math.max(d/LW(),d/LH()),w=LW()*r,h=LH()*r;x.save();x.beginPath();x.arc(px+d/2,py+d/2,d/2,0,7);x.clip();x.drawImage(LG,px+(d-w)/2,py+(d-h)/2,w,h);x.restore()}
function wm(top,bot){if(!$('wm').checked||LG.complete===false)return;const H=cv.height,ci=$('ci').checked,lw=W*$('sz').value/100,lh=ci?lw:lw*LH()/LW(),m=W*.03,pd=lw*.07,p=S.pos;
const px=p[1]=='l'?m:p[1]=='c'?(W-lw)/2:W-lw-m,b=H-bot,py=p[0]=='t'?top+m:p[0]=='m'?top+(b-top-lh)/2:b-lh-m;
x.save();x.globalAlpha=$('op').value/100;if($('bd').checked){x.fillStyle='#fff';x.beginPath();if(ci)x.arc(px+lw/2,py+lw/2,lw/2+pd,0,7);else x.roundRect(px-pd,py-pd,lw+2*pd,lh+2*pd,lw*.09);x.fill()}
if(ci)clogo(px,py,lw);else x.drawImage(LG,px,py,lw,lh);x.restore()}
function frame(){const f=$('fr').value,H=cv.height,r=(c,w,i=0)=>{x.strokeStyle=c;x.lineWidth=w;x.strokeRect(i,i,W-2*i,H-2*i)};if(f=='n')return;x.save();if(f=='w')r('#fff',64);if(f=='k')r('#111',64);if(f=='t'){r('#dc1032',44);r('#003893',14,22)}if(f=='y'){r('#fbb91c',40);r('#111',10,20)}x.restore()}
function whiteOut(im){const s=Math.min(1,800/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*s),h=Math.round(im.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(im,0,0,w,h);const d=g.getImageData(0,0,w,h),p=d.data,n=w*h,seen=new Uint8Array(n),st=[],lt=i=>p[i*4+3]>0&&p[i*4]>226&&p[i*4+1]>226&&p[i*4+2]>226;for(let i=0;i<w;i++)st.push(i,n-1-i);for(let j=0;j<h;j++)st.push(j*w,j*w+w-1);while(st.length){const i=st.pop();if(seen[i]||!lt(i))continue;seen[i]=1;p[i*4+3]=0;const xx=i%w;if(xx>0)st.push(i-1);if(xx<w-1)st.push(i+1);if(i>=w)st.push(i-w);if(i<n-w)st.push(i+w)}g.putImageData(d,0,0);return c}
function prep(){LG=CU&&$('rb').checked?whiteOut(logo):logo}
let q=0;function go(){cancelAnimationFrame(q);q=requestAnimationFrame(render)}
function render(){t1=$('t1').value;t2=$('t2').value;LN=$('lb').value.split('\n');const[a,b]=T[S.tpl].r();frame();wm(a,b)}
function thumbs(){$('th').innerHTML='';S.imgs.forEach((im,i)=>{const d=document.createElement('div'),g=document.createElement('img'),r=document.createElement('b');g.src=im.src;g.alt='Photo '+(i+1);g.onclick=()=>{if(i){[S.imgs[i-1],S.imgs[i]]=[S.imgs[i],S.imgs[i-1]];thumbs();go()}};r.textContent='×';r.title='Remove';r.onclick=()=>{S.imgs.splice(i,1);thumbs();go()};d.append(g,r);$('th').append(d)})}
function load(files){[...files].filter(f=>f.type.startsWith('image/')).slice(0,9-S.imgs.length).forEach(f=>{const i=new Image();i.onload=()=>{S.imgs.push(i);thumbs();go()};i.src=URL.createObjectURL(f)})}
function fontsGo(){document.fonts.load(fnt(40),'Aअ').then(go);document.fonts.load('800 40px "Noto Sans Devanagari"','अ')}
fontsGo();document.fonts.ready.then(go);logo.onload=()=>{prep();$('lp').src=logo.src;go()};$('rb').addEventListener('input',()=>{prep();go()});
$('lu').onclick=()=>$('lf').click();$('lr').onclick=()=>{CU=false;$('rb').checked=false;logo.src=DEF};
$('lf').onchange=e=>{const f=e.target.files[0];if(f&&f.type.startsWith('image/')){CU=true;logo.src=URL.createObjectURL(f)}e.target.value=''};
['t1','t2','lb','wm','bd','cp','fl','ra','sy','ds','fr','ci'].forEach(i=>$(i).addEventListener('input',go));
$('fo').oninput=fontsGo;
$('sz').oninput=e=>{$('so').textContent=e.target.value;go()};$('op').oninput=e=>{$('oo').textContent=e.target.value;go()};$('ts').oninput=e=>{$('tso').textContent=e.target.value;go()};
document.querySelectorAll('input[name=t]').forEach(r=>r.onchange=()=>{S.tpl=r.value;go()});
document.querySelectorAll('input[name=p]').forEach(r=>r.onchange=()=>{S.pos=r.value;go()});
$('up').onclick=()=>$('f').click();cv.onclick=()=>{if(!S.imgs.length)$('f').click()};
$('f').onchange=e=>{load(e.target.files);e.target.value=''};
['dragover','drop'].forEach(ev=>document.body.addEventListener(ev,e=>{e.preventDefault();if(ev=='drop')load(e.dataTransfer.files)}));
$('dl').onclick=()=>{render();const n=$('nt');cv.toBlob(async b=>{try{const d=window.claude?await claude.use('downloads'):null;if(d){await d.save({filename:'nepal-unfiltered-meme.png',data:b});n.textContent='Saved.';return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nepal-unfiltered-meme.png';document.body.append(a);a.click();a.remove();n.textContent='Saved.'}catch(e){n.textContent=e&&e.code=='declined'?'Save cancelled.':'Could not save. Try again.'}},'image/png')};
</script></body></html>
