<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memeghar | Nepal Unfiltered</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@700&family=Bebas+Neue&family=Archivo+Black&family=Montserrat:wght@900&family=Comic+Neue:wght@700&family=Noto+Sans+Devanagari:wght@800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<meta name="description" content="Memeghar by Nepal Unfiltered. Upload photos, pick a template, add your logo, save your meme.">
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#0e1726;--mute:#6b778c;--line:#dfe4ee;--acc:#2f5bff;--on:#fff;--soft:#e6ecff;--stage:#e2e7f0;--grid:rgba(47,91,255,.07);--card:0 1px 2px rgba(14,23,38,.05),0 12px 28px -16px rgba(14,23,38,.22);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--panel:#121a2f;--ink:#e8ecf8;--mute:#8e9bb8;--line:#222c47;--acc:#7b93ff;--on:#0b1020;--soft:#1b2750;--stage:#0a0f1d;--grid:rgba(123,147,255,.08);--card:0 1px 2px rgba(0,0,0,.3),0 12px 28px -16px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0b1020;--panel:#121a2f;--ink:#e8ecf8;--mute:#8e9bb8;--line:#222c47;--acc:#7b93ff;--on:#0b1020;--soft:#1b2750;--stage:#0a0f1d;--grid:rgba(123,147,255,.08);--card:0 1px 2px rgba(0,0,0,.3),0 12px 28px -16px rgba(0,0,0,.6)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14.5px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--panel);border-bottom:1px solid var(--line)}
header img{height:52px;width:52px;border-radius:50%;box-shadow:0 4px 14px rgba(14,23,38,.25)}
header h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.4px;line-height:1.1}
header span{font-size:13px;color:var(--mute);font-weight:500}
main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:24px;padding:24px 28px;max-width:1280px;margin:0 auto}
.stage{background-color:var(--stage);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;border:1px solid var(--line);border-radius:22px;display:flex;align-items:flex-start;justify-content:center;padding:28px;min-height:360px;position:sticky;top:10px;align-self:start}
canvas{max-width:100%;max-height:82vh;width:auto;height:auto;border-radius:10px;box-shadow:0 24px 50px -14px rgba(15,30,80,.45);background:#fff}
aside{display:flex;flex-direction:column;gap:14px}
details{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--card)}
summary{font-size:15px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
details[open] summary{margin-bottom:12px}
h2{font-size:13px;margin:0 0 6px;color:var(--mute);font-weight:600}
h3{font-size:11.5px;margin:12px 0 7px;color:var(--mute);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:block;padding:6px 13px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:13px;background:var(--panel);transition:background .15s}
.chip input:checked+span{background:var(--acc);border-color:var(--acc);color:var(--on)}
.chip input:focus-visible+span,.tc input:focus-visible+span,.pos input:focus-visible+span{outline:3px solid var(--soft);outline-offset:1px;border-color:var(--acc)}
input[type=text],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
input[type=text]:focus,textarea:focus,select:focus{outline:3px solid var(--soft);border-color:var(--acc)}
textarea{resize:vertical;min-height:64px}
input[type=range]{width:100%;accent-color:var(--acc)}
label.l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);font-weight:600}
button{font:700 14.5px "Plus Jakarta Sans",sans-serif;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink);transition:transform .12s,box-shadow .12s}
.pri{background:var(--acc);border-color:var(--acc);color:var(--on);width:100%;box-shadow:0 10px 22px -10px var(--acc)}
.pri:hover{transform:translateY(-1px);box-shadow:0 14px 26px -10px var(--acc)}
.pri:active{transform:translateY(1px)}
.ghost{background:var(--panel)}
.ghost:hover{border-color:var(--acc)}
button:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tc{position:relative}.tc input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.tc span{display:flex;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:14px;font-weight:600;font-size:13px;background:var(--panel);min-height:44px;transition:background .15s,border-color .15s}
.tc i{font-style:normal;font-size:18px}
.tc input:checked+span{background:var(--soft);border-color:var(--acc);color:var(--ink);font-weight:700}
.tc span:hover{border-color:var(--acc)}
.pos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:108px}
.pos label{position:relative;height:26px}
.pos input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.pos span{display:block;height:100%;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.pos input:checked+span{background:var(--acc);border-color:var(--acc)}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.th div{position:relative;width:56px;height:56px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:pointer}
.th b{position:absolute;top:-6px;right:-6px;width:21px;height:21px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:13px;line-height:21px;text-align:center;cursor:pointer}
.lp{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lp img{width:60px;height:60px;object-fit:contain;border:1px solid var(--line);border-radius:14px;background:repeating-conic-gradient(#e5e8ee 0 25%,#fff 0 50%) 0 0/14px 14px}
.lp div{display:flex;flex-direction:column;gap:6px;flex:1}.lp button{padding:8px 10px;font-size:13px}
.note{font-size:12px;color:var(--mute);margin:0}
@media(max-width:880px){main{grid-template-columns:1fr;padding:14px}.stage{position:static;padding:14px}header{padding:12px 16px}}
</style></head><body>

<script>
const W=1080,cv=document.getElementById('c'),x=cv.getContext('2d'),$=id=>document.getElementById(id);

const FONTS={impact:['Impact, Anton, sans-serif',400,'Impact (classic)'],anton:['Anton',400,'Anton'],oswald:['Oswald',700,'Oswald'],bebas:['"Bebas Neue"',400,'Bebas Neue'],archivo:['"Archivo Black"',400,'Archivo Black'],mont:['Montserrat',900,'Montserrat Black'],comic:['"Comic Neue","Comic Sans MS"',700,'Comic Sans style'],nep:['"Noto Sans Devanagari"',800,'Nepali (Devanagari)']};
Object.entries(FONTS).forEach(([k,v])=>$('fo').insertAdjacentHTML('beforeend',`<option value="${k}">Font: ${v[2]}</option>`));
const PAL={u:{bg:'#f3f6ff',ink:'#0e1726',acc:'#2f5bff',acc2:'#ffd166'},c:{bg:'#ffffff',ink:'#000000',acc:'#dc1032',acc2:'#fbb91c'},n:{bg:'#fff4ee',ink:'#0b2a6f',acc:'#dc143c',acc2:'#fbb91c'},d:{bg:'#111111',ink:'#ffffff',acc:'#0fb4e3',acc2:'#fbb91c'},s:{bg:'#ffe8d1',ink:'#3a1030',acc:'#ff5a36',acc2:'#7a2a8c'},m:{bg:'#e6fbf1',ink:'#06352b',acc:'#10b981',acc2:'#f59e0b'}};const P=()=>PAL[$('ds').value];
const STY={w:['#fff','#000'],y:['#ffe600','#000'],r:['#fff','#dc1032'],k:['#000',null]};
const FIL={n:'none',bw:'grayscale(1) contrast(1.1)',df:'contrast(2) saturate(2.4) brightness(1.05)',se:'sepia(.9)'};

function wrap(t,f,mw){x.font=f;const L=[];let c='';t.split(/\s+/).filter(Boolean).forEach(q=>{const n=c?c+' '+q:q;if(x.measureText(n).width>mw&&c){L.push(c);c=q}else c=n});if(c)L.push(c);return L}
function fit(t,mw,ml,st,mn,o={}){t=o.nc?t:cap(t);st*=K();mn*=K();const F=s=>o.sys?sys(s):fnt(s,o.fk);for(let s=st;s>=mn;s-=4){const f=F(s),L=wrap(t,f,mw);if(L.length<=ml)return{L,s,f}}const f=F(mn);return{L:wrap(t,f,mw),s:mn,f}}
function draw(t,cx,y,mw,ml,st,mn,o={}){if(!t||!t.trim())return 0;const q=fit(t,mw,ml,st,mn,o),[fill,stk]=o.fill?[o.fill,o.stroke]:STY[$('sy').value];
x.font=q.f;x.textAlign=o.align||'center';x.textBaseline='top';x.lineJoin='round';const lh=q.s*1.12,h=lh*q.L.length;let yy=o.bottom?y-h:o.mid?y-h/2:y;
q.L.forEach(l=>{if(stk){x.lineWidth=q.s/7;x.strokeStyle=stk;x.strokeText(l,cx,yy)}x.fillStyle=fill;x.fillText(l,cx,yy);yy+=lh});return h}

function ph(i,dx,dy,dw,dh){const im=S.imgs[i];if(im)return cover(im,dx,dy,dw,dh);x.fillStyle='#d9d3cb';x.fillRect(dx,dy,dw,dh);x.fillStyle='#7a7268';x.font='700 40px "Plus Jakarta Sans",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('+ photo '+(i+1),dx+dw/2,dy+dh/2)}
function PH(){const r=$('ra').value,im=S.imgs[0];if(r=='s')return 1080;if(r=='p')return 1350;if(r=='w')return 608;return im?Math.min(1500,Math.max(700,Math.round(W*im.height/im.width))):1080}

news:{e:'📺',n:'Breaking news',g:1,r(){const h=PH(),bh=190,y=h-bh;size(h);ph(0,0,0,W,h);x.fillStyle=P().acc;x.fillRect(0,y,W,bh);x.fillStyle='#000';x.fillRect(0,y,W,8);x.fillStyle='#fbb91c';x.fillRect(0,y-46,330,46);draw(lab(0,'BREAKING NEWS'),22,y-23,300,1,30,16,{align:'left',mid:1,fill:'#000'});draw(t1||'Your headline here',35,y+24,W-70,2,56,32,{align:'left',fill:'#fff'});draw(t2,35,y+bh-14,W-70,1,28,18,{bottom:1,align:'left',fill:'#fff'});return[0,bh+46]}},
poster:{e:'🍿',n:'Movie poster',g:1,r(){const h=PH();size(h);ph(0,0,0,W,h);const g=x.createLinearGradient(0,h*.4,0,h);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.88)');x.fillStyle=g;x.fillRect(0,h*.4,W,h*.6);const s=draw(t2,50,h-44,W-100,1,44,24,{bottom:1,align:'left',fill:'#fbb91c'});draw(t1,50,h-44-s-(s?14:0),W-100,3,110,48,{bottom:1,align:'left',fill:'#fff'});return[0,0]}},

post:{e:'💬',n:'Social post',g:1,r(){const P_=P(),im=S.imgs[0],pw=W-80,pa=im?Math.min(1100,Math.max(520,Math.round(pw*im.height/im.width))):760,o={sys:1,nc:1},q=t1.trim()?fit(t1,pw,6,46,30,o):{L:[],s:0},th=q.L.length*q.s*1.3,H=Math.round(174+th+(th?24:0)+pa+110);size(H);clogo(40,40,100);draw(lab(0,'Nepal Unfiltered'),166,52,W-220,1,40,26,{align:'left',fill:P_.ink,sys:1,nc:1});draw(lab(1,'Just now'),166,100,W-220,1,28,20,{align:'left',fill:'#8a8378',sys:1,nc:1});if(th)draw(t1,40,174,pw,6,46,30,{align:'left',fill:P_.ink,sys:1,nc:1});const py=174+th+(th?24:0);x.save();x.beginPath();x.roundRect(40,py,pw,pa,22);x.clip();ph(0,40,py,pw,pa);x.restore();draw('👍❤️😂  1.2K        218 comments  ·  94 shares',40,py+pa+36,pw,1,30,20,{align:'left',fill:'#8a8378',sys:1,nc:1});return[0,0]}},
quote:{e:'❝',n:'Quote card',g:1,r(){const h=PH();size(h);ph(0,0,0,W,h);x.fillStyle='rgba(0,0,0,.58)';x.fillRect(0,0,W,h);draw('“',W/2,70,300,1,300,120,{fill:P().acc2});const a=draw(t1,W/2,h/2+30,W-180,6,92,38,{mid:1,fill:'#fff'});draw(t2?'— '+t2:'',W/2,h/2+30+a/2+36,W-180,1,44,24,{fill:P().acc2});return[0,0]}},
polaroid:{e:'📸',n:'Polaroid',g:1,r(){const fw=W-220,s=fw-60,fh=s+260,H=fh+220;size(H);x.fillStyle=P().acc2;x.globalAlpha=.25;x.fillRect(0,0,W,H);x.globalAlpha=1;x.save();x.translate(W/2,H/2);x.rotate(-.035);x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=36;x.shadowOffsetY=12;x.fillStyle='#fff';x.fillRect(-fw/2,-fh/2,fw,fh);x.shadowColor='transparent';ph(0,-s/2,-fh/2+30,s,s);draw(t1,0,-fh/2+30+s+100,fw-80,2,84,40,{mid:1,fill:'#222',fk:'comic',nc:1});x.restore();return[0,0]}},
subtitle:{e:'🎬',n:'Movie subtitle',g:1,r(){const h=PH(),bar=110;size(h+2*bar);x.fillStyle='#000';x.fillRect(0,0,W,h+2*bar);ph(0,0,bar,W,h);const o={fill:'#ffe600',stroke:'#000',bottom:1,sys:1,nc:1},a=draw(t1,W/2,bar+h-34,W-140,2,60,32,o);draw(t2,W/2,bar+h-34-a-6,W-140,2,60,32,{...o,fill:'#fff'});return[bar,bar]}},
trio:{e:'👥',n:'Three way',g:2,r(){const b=titleBar(),h=860,g=8,cw=(W-2*g)/3;size(b+h);if(b)draw(t1,W/2,28,W-100,3,80,36,{fill:P().ink});for(let i=0;i<3;i++){const px=i*(cw+g);ph(i,px,b,cw,h);draw(lab(i),px+cw/2,b+h-24,cw-30,4,70,28,{bottom:1})}return[b,0]}},

film:{e:'🎞️',n:'Film strip',g:2,r(){const n=Math.min(4,Math.max(2,S.imgs.length)),fh=560,g=14,H=n*(fh+g)+g;size(H);x.fillStyle='#111';x.fillRect(0,0,W,H);x.fillStyle='#f3efe9';for(let y=14;y<H-30;y+=64){x.beginPath();x.roundRect(28,y,34,40,7);x.roundRect(W-62,y,34,40,7);x.fill()}for(let i=0;i<n;i++){const y=g+i*(fh+g);ph(i,100,y,W-200,fh);draw(lab(i),W/2,y+fh-22,W-260,2,70,30,{bottom:1})}return[0,0]}},

heads:{e:'🐉',n:'Three heads',g:2,r(){const b=titleBar(),g=14,cw=(W-4*g)/3,top=230,hh=600,by=b+top+hh+110,H=by+330;size(H);if(b)draw(t1,W/2,28,W-100,3,80,36,{fill:P().ink});const cx=[g+cw/2,W/2,W-g-cw/2];x.strokeStyle=P().ink;x.lineWidth=40;x.lineCap='round';cx.forEach(c=>{x.beginPath();x.moveTo(c,b+top+hh);x.quadraticCurveTo(c,by,W/2,by+90);x.stroke()});cx.forEach((c,i)=>{const px=c-cw/2,py=b+top+(i==1?-50:0);x.save();x.beginPath();x.roundRect(px,py,cw,hh,36);x.clip();ph(i,px,py,cw,hh);x.restore();x.strokeStyle=P().ink;x.lineWidth=10;x.beginPath();x.roundRect(px,py,cw,hh,36);x.stroke();draw(lab(i),c,py-16,cw,3,62,26,{bottom:1,fill:P().ink})});x.fillStyle=P().ink;x.beginPath();x.arc(W/2,by+110,150,0,7);x.fill();draw(lab(3,t2),W/2,by+110,260,3,50,22,{mid:1,fill:P().bg,sys:1});return[b,0]}},
vschad:{e:'💪',n:'Virgin vs Chad',g:2,r(){const b=titleBar(),h=700,hb=110,H=b+hb+h+160;size(H);if(b)draw(t1,W/2,28,W-100,3,80,36,{fill:P().ink});[['#3b6fd4',0],['#dc1032',1]].forEach(([c,i])=>{const px=i*W/2;x.fillStyle=c;x.fillRect(px,b,W/2,hb);draw(lab(i,i?'CHAD':'VIRGIN'),px+W/4,b+hb/2,W/2-40,1,80,36,{mid:1,fill:'#fff'});ph(i,px+(i?4:0),b+hb,W/2-4,h);draw(lab(i+2,i?'':t2),px+W/4,b+hb+h+80,W/2-50,3,56,26,{mid:1,fill:P().ink,sys:1,nc:1})});return[b,0]}},
gru:{e:'📋',n:'4 step plan',g:2,r(){const g=10,pw=(W-3*g)/2,ch=150,H=2*(pw+ch)+3*g;size(H);for(let i=0;i<4;i++){const px=g+(i%2)*(pw+g),py=g+Math.floor(i/2)*(pw+ch+g);ph(i,px,py,pw,pw);x.fillStyle='#fff';x.fillRect(px,py+pw,pw,ch);draw(lab(i),px+pw/2,py+pw+ch/2,pw-30,3,50,22,{mid:1,fill:'#000',sys:1,nc:1})}return[0,0]}},
buttons:{e:'🔴',n:'Two buttons',g:1,r(){const h=PH();size(h);ph(0,0,0,W,h);const bw=W/2-70,bh=190;[0,1].forEach(i=>{x.save();x.translate(40+i*(bw+60)+bw/2,70+bh/2);x.rotate(i?.03:-.03);x.fillStyle='#fff';x.strokeStyle='#111';x.lineWidth=6;x.beginPath();x.roundRect(-bw/2,-bh/2,bw,bh,22);x.fill();x.stroke();draw(lab(i,i?t2:t1),0,0,bw-40,3,52,24,{mid:1,fill:'#111',sys:1,nc:1});x.restore()});draw(lab(2),W/2,h-28,W-100,2,90,40,{bottom:1});return[0,0]}},
wanted:{e:'🤠',n:'Wanted poster',g:1,r(){const h=1350,py=330,pk=640,o={fill:'#3b2410',fk:'anton'};size(h);x.fillStyle='#e9d5a1';x.fillRect(0,0,W,h);x.strokeStyle='#5a3b1a';x.lineWidth=14;x.strokeRect(36,36,W-72,h-72);x.lineWidth=4;x.strokeRect(58,58,W-116,h-116);draw('WANTED',W/2,90,W-200,1,190,90,o);const f0=$('fl').value;$('fl').value='se';ph(0,90,py,W-180,pk);$('fl').value=f0;x.strokeStyle='#3b2410';x.lineWidth=8;x.strokeRect(90,py,W-180,pk);draw(t1||'YOUR FRIEND',W/2,py+pk+30,W-200,1,110,50,o);draw(t2||'DEAD OR ALIVE',W/2,h-110,W-200,1,60,30,{bottom:1,fill:'#7a1f1f',fk:'anton'});return[0,0]}},
